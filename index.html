<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бібліотека повідомлень</title>
    <link rel="stylesheet" href="./style/main.min.css">
</head>

<body>
    <main class="container">
        <h1 class="page-title">Бібліотека повідомлень</h1>
        <div class="alerts">
            <div class="alert alert--info"> <button class="alert__close" type="button">&times;</button>
                <h2 class="alert__title"> Інформація </h2>
                <p class="alert__text"> У тебе з'явилося нове завдання. </p>
            </div>
            <div class="alert alert--success"> <button class="alert__close" type="button">&times;</button>
                <h2 class="alert__title"> Місію виконано </h2>
                <p class="alert__text"> Ти отримав 250 XP. </p>
            </div>
            <div class="alert alert--warning"> <button class="alert__close" type="button">&times;</button>
                <h2 class="alert__title"> Попередження </h2>
                <p class="alert__text"> Термін виконання завдання закінчується. </p>
            </div>
            <div class="alert alert--error"> <button class="alert__close" type="button">&times;</button>
                <h2 class="alert__title"> Помилка </h2>
                <p class="alert__text"> Не вдалося виконати операцію. </p>
            </div>
        </div>
    </main>
</body>

</html>
